name: Patch Vulnerabilities in Node.js

on:
  # Weekly safety net for nested-dependency vulnerabilities that Renovate's
  # transitiveRemediation can't fix via a parent bump; npm audit fix rewrites
  # the lockfile in place. Runs early Monday so PRs are ready for review.
  schedule:
    - cron: '0 5 * * 1' # Mondays 05:00 UTC (~06:00-07:00 CET)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
jobs:
  patch-vulnerabilities:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: 'npm'
    - name: Install dependencies
      run: npm ci

    - name: Run npm audit fix
      run: npm audit fix --min-release-age=0
      continue-on-error: true

    - name: Commit and push changes
      run: |
        if git diff --quiet; then
          echo "No changes to commit."
          exit 0
        fi
        BRANCH_NAME="security-patch-${GITHUB_REF_NAME}-$(date +'%Y-%m-%d')"
        git config user.name "livingdocs-machine"
        git config user.email "machine@livingdocs.io"
        git checkout -b $BRANCH_NAME
        git add package.json package-lock.json
        git commit -m "fix(deps): automatically patch Node.js vulnerabilities"
        git push origin $BRANCH_NAME
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create a pull request
      run: |
        BRANCH_NAME="security-patch-${GITHUB_REF_NAME}-$(date +'%Y-%m-%d')"
        if git ls-remote --exit-code --heads origin $BRANCH_NAME; then
          gh pr create -B $GITHUB_REF_NAME -H $BRANCH_NAME --title "Patch vulnerabilities [$GITHUB_REF_NAME]" --body 'Created by Github action'
        else
          echo "Branch doesn't exist, so PR creation can be skipped."
          exit 0
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
