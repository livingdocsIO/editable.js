---
kind: pipeline
name: default

clone:
  depth: 50

steps:
- name: eslint
  image: marcbachmann/eslint:9.6.0
  environment:
    GH_TOKEN:
      from_secret: GH_TOKEN

- name: install
  image: cypress/browsers:node-24.19.0-chrome-151.0.7922.137-1-ff-154.0-edge-151.0.4129.93-1
  commands: [npm ci]

- name: build
  image: cypress/browsers:node-24.19.0-chrome-151.0.7922.137-1-ff-154.0-edge-151.0.4129.93-1
  commands: ["npm run build -s"]
  depends_on: [install]

- name: test
  image: cypress/browsers:node-24.19.0-chrome-151.0.7922.137-1-ff-154.0-edge-151.0.4129.93-1
  commands: ["npm run test:ci -s"]
  depends_on: [install]

- name: release
  image: livingdocs/semantic-release:v1.2.2
  environment:
    GH_TOKEN:
      from_secret: GH_TOKEN
    NPM_TOKEN:
      from_secret: NPM_TOKEN_PUBLISH
  when:
    event: [push]
  depends_on: [test]

- name: publish-gh-pages
  image: plugins/gh-pages
  settings:
    pages_directory: examples
    copy_contents: "true"
    username: x-oauth-basic
    password:
      from_secret: GH_TOKEN
  when:
    event: [tag]
  depends_on: [build]

trigger:
  event: [push, tag, pull_request]
